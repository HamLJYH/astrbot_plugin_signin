<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到系统</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo-item" title="签到系统">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v6m4.22-10.22l4.24-4.24M6.34 6.34L2.1 2.1m17.8 17.8l-4.24-4.24M6.34 17.66l-4.24 4.24M23 12h-6m-6 0H1m20.24-4.24l-4.24 4.24M6.34 6.34l-4.24-4.24"/>
                    </svg>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-tab="overview" title="总览">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M9 3v18"/>
                    </svg>
                </button>
                <button class="nav-item" data-tab="users" title="用户管理">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                </button>
                <button class="nav-item" data-tab="records" title="签到记录">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3v18h18"/>
                        <path d="m19 9-5 5-4-4-3 3"/>
                    </svg>
                </button>
            </nav>

            <div class="sidebar-bottom">
                <button class="tool-btn" id="theme-toggle" title="切换主题">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
                <button class="tool-btn" id="lang-toggle" title="切换语言">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M2 12h20"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <header class="topbar">
                <h1 id="page-title">总览</h1>
                <button class="refresh-btn" id="refresh-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                        <path d="M16 21h5v-5"/>
                    </svg>
                    <span>刷新</span>
                </button>
            </header>

            <div class="content-area">
                <!-- 总览面板 -->
                <section class="tab-panel active" id="panel-overview">
                    <div class="stats-grid">
                        <div class="stat-card blue">
                            <div class="stat-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                    <circle cx="9" cy="7" r="4"/>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                                </svg>
                            </div>
                            <div class="stat-data">
                                <div class="stat-value" id="ov-users">-</div>
                                <div class="stat-label">总用户数</div>
                            </div>
                        </div>
                        <div class="stat-card green">
                            <div class="stat-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/>
                                    <path d="M12 18V6"/>
                                </svg>
                            </div>
                            <div class="stat-data">
                                <div class="stat-value" id="ov-points">-</div>
                                <div class="stat-label">总积分</div>
                            </div>
                        </div>
                        <div class="stat-card orange">
                            <div class="stat-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="16" y1="13" x2="8" y2="13"/>
                                    <line x1="16" y1="17" x2="8" y2="17"/>
                                    <polyline points="10 9 9 9 8 9"/>
                                </svg>
                            </div>
                            <div class="stat-data">
                                <div class="stat-value" id="ov-today">-</div>
                                <div class="stat-label">今日签到</div>
                            </div>
                        </div>
                        <div class="stat-card purple">
                            <div class="stat-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                                </svg>
                            </div>
                            <div class="stat-data">
                                <div class="stat-value" id="ov-7d">-</div>
                                <div class="stat-label">7日活跃</div>
                            </div>
                        </div>
                        <div class="stat-card cyan">
                            <div class="stat-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 20v-6M6 20V10M18 20V4"/>
                                </svg>
                            </div>
                            <div class="stat-data">
                                <div class="stat-value" id="ov-30d">-</div>
                                <div class="stat-label">30日活跃</div>
                            </div>
                        </div>
                    </div>

                    <div class="two-col">
                        <div class="panel-card">
                            <div class="panel-header">
                                <h3>🏆 积分排行</h3>
                            </div>
                            <div class="panel-body">
                                <table class="simple-table">
                                    <thead>
                                        <tr><th>排名</th><th>用户</th><th>积分</th><th>连续</th></tr>
                                    </thead>
                                    <tbody id="ov-rank-body">
                                        <tr><td colspan="4" class="loading">加载中</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="panel-card">
                            <div class="panel-header">
                                <h3>🕐 最近签到</h3>
                            </div>
                            <div class="panel-body">
                                <table class="simple-table">
                                    <thead>
                                        <tr><th>用户</th><th>日期</th><th>连续</th></tr>
                                    </thead>
                                    <tbody id="ov-recent-body">
                                        <tr><td colspan="3" class="loading">加载中</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 用户管理 -->
                <section class="tab-panel" id="panel-users">
                    <div class="panel-card">
                        <div class="panel-header flex-between">
                            <h3>👥 用户列表</h3>
                            <div class="search-box">
                                <input type="text" id="user-search" placeholder="搜索用户...">
                                <span class="search-count" id="user-count">共 0 人</span>
                            </div>
                        </div>
                        <div class="panel-body no-pad">
                            <table class="simple-table">
                                <thead>
                                    <tr>
                                        <th style="width:50px">#</th>
                                        <th>用户ID</th>
                                        <th>昵称</th>
                                        <th>积分</th>
                                        <th>累计签到</th>
                                        <th>连续</th>
                                        <th>道具</th>
                                        <th style="width:80px">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="users-tbody">
                                    <tr><td colspan="8" class="loading">加载中</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- 签到记录 -->
                <section class="tab-panel" id="panel-records">
                    <div class="panel-card">
                        <div class="panel-header">
                            <h3>📋 签到记录</h3>
                        </div>
                        <div class="panel-body no-pad">
                            <table class="simple-table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>用户</th>
                                        <th>日期</th>
                                        <th>积分</th>
                                        <th>连续</th>
                                    </tr>
                                </thead>
                                <tbody id="records-tbody">
                                    <tr><td colspan="5" class="loading">加载中</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- 修改积分弹窗 -->
    <div class="modal-overlay" id="points-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>修改积分</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modal-user-info" class="modal-info"></p>
                <div class="form-row">
                    <label>操作</label>
                    <select id="modal-action">
                        <option value="add">增加积分</option>
                        <option value="deduct">扣除积分</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>数量</label>
                    <input type="number" id="modal-amount" min="1" value="10">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modal-cancel">取消</button>
                <button class="btn-primary" id="modal-confirm">确认</button>
            </div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
